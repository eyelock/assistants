name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # The merge queue runs the required check (All Clear) on the branch as it will be
  # with the queued pull requests merged. Every job runs there: there is no pull
  # request to diff, and a skipped required job would stall the queue.
  merge_group:

# Only a pull request's superseded runs are cancelled. A push run on develop or main
# is never cancelled by the next merge, so a red result always surfaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ynd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIN_DIR: ${{ github.workspace }}/.bin
        run: |
          scripts/install-ynd.sh
          echo "$BIN_DIR" >> "$GITHUB_PATH"

      - name: Manifest sync check
        run: pnpm sync-manifests:check

      - name: Biome (format + lint)
        run: pnpm exec biome check

      - name: ynd lint
        run: ynd lint

      - name: ynd validate
        run: ynd validate

      - name: Tests
        run: pnpm test

      - name: cspell
        run: pnpm lint:spell

      - name: actionlint
        uses: reviewdog/action-actionlint@v1

      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          ignore_paths: "node_modules"
          severity: error

      - name: Changeset status (PRs only)
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}

  skillspector:
    name: SkillSpector
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pull requests scan the skills they change; pushes scan every skill.
      # Eval fixtures and e2e fixtures are test data, not shipped skills.
      - uses: eyelock/actions/skillspector@2b4b0eafc45da186506a6fd72774482b636d55aa # skillspector-v1
        with:
          exclude: |
            */evals/files/*
            e2e-fixtures/*

  # Every wheelhouse plugin script is linted (shellcheck, warnings and up) and its tests are run, on
  # Linux and on macOS: the scripts run on both, and the Check job above runs on Linux alone. It sits
  # in a job of its own so it is independent of the Check job's steps.
  scripts:
    name: Plugin scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Tools the scripts and their tests need
        run: |
          for tool in shellcheck jq; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              if [ "$RUNNER_OS" = macOS ]; then brew install "$tool"; else sudo apt-get install -y "$tool"; fi
            fi
          done
          shellcheck --version
          jq --version

      - name: shellcheck every plugin script
        run: find plugins/wheelhouse/skills -path '*/scripts/*.sh' -print0 | xargs -0 shellcheck -S warning

      - name: Plugin script tests
        run: node --test plugins/wheelhouse/evals/*.test.mjs

  # The one required check. It fails when any job it needs failed, was cancelled or
  # was skipped, so a green All Clear means every gate actually ran and passed.
  all-clear:
    name: All Clear
    if: always()
    needs: [check, skillspector, scripts]
    runs-on: ubuntu-latest
    steps:
      - name: Every gate passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Gate results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required job finished as '$result', not 'success'"
              exit 1
            fi
          done
